<meta name="claude:viewport-fit-sides" content="cover">
<title>Búnker de zombies</title>
<style>
:root {
  --bg: #07070a;
  --fg: #e9e1d3;
  --accent: #b3261e;
  --gold: #c9a227;
  --muted: #9a8f80;
  --line: #2b221f;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.45 ui-monospace, Menlo, Consolas, "Courier New", monospace;
  overflow: hidden;
}
#wrap {
  position: fixed;
  inset: 0;
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  background: #000;
  cursor: crosshair;
}
.hud { position: absolute; pointer-events: none; text-shadow: 0 1px 0 #000; }
.label { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.big { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { width: 160px; height: 8px; background: #1d1210; border: 1px solid #000; margin-top: 4px; }
.bar > div { height: 100%; width: 100%; transition: width .15s; }
#hp-fill { background: var(--accent); }
#st-fill { height: 100%; width: 100%; background: var(--gold); transition: width .15s; }
#stwrap { width: 120px; height: 3px; margin-top: 6px; background: rgba(0, 0, 0, .5); opacity: 0; transition: opacity .5s; }
.pl { display: flex; align-items: center; gap: 10px; }
.avatar { width: 52px; height: 52px; background: #15110f; box-shadow: inset 0 0 0 1px var(--line); display: grid; place-items: center; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar svg { width: 70%; height: 70%; fill: var(--muted); }
#btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
#btns button { font: inherit; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; padding: 10px 22px; background: var(--accent); color: #fff; border: 1px solid #000; cursor: pointer; }
#btn-quit, #btn-opts { background: #1d1a18; color: var(--fg); border: 1px solid var(--line); }
#opts { display: flex; flex-direction: column; align-items: center; gap: 12px; }
#opts-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
#opts button { font: inherit; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; padding: 10px 18px; background: #1d1a18; color: var(--fg); border: 1px solid var(--line); cursor: pointer; }
#opts-hint { margin: 0; color: var(--muted); font-size: 12px; max-width: 46ch; text-wrap: balance; }
.pick { display: inline-block; margin-top: 10px; font-size: 12px; text-decoration: underline; cursor: pointer; color: var(--fg); pointer-events: auto; }
#tl { top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(14px + env(safe-area-inset-left, 0px)); }
#tr { top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(14px + env(safe-area-inset-right, 0px)); text-align: right; }
#bl { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: calc(14px + env(safe-area-inset-left, 0px)); }
#br { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); right: calc(14px + env(safe-area-inset-right, 0px)); text-align: right; }
#next { font-size: 12px; color: var(--muted); margin-top: 4px; }
#reloading { color: var(--gold); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
#prompt {
  left: 50%;
  bottom: calc(80px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  font-size: 13px;
  color: var(--fg);
  white-space: nowrap;
}
#pw { top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--gold); text-align: center; white-space: pre-line; }
#cross { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; pointer-events: none; }
#cross::before, #cross::after { content: ""; position: absolute; background: rgba(255, 255, 255, .8); }
#cross::before { left: 6px; top: 0; width: 2px; height: 14px; }
#cross::after { top: 6px; left: 0; width: 14px; height: 2px; }
#hurt {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(transparent 40%, rgba(160, 0, 0, .9));
}
#overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 20px;
  text-align: center;
  background: rgba(5, 3, 3, .82);
  cursor: pointer;
}
h1 { margin: 0; font-size: 26px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); text-wrap: balance; }
#ov-text { margin: 0; max-width: 46ch; text-wrap: balance; }
#ov-hint { margin: 0; max-width: 60ch; color: var(--muted); font-size: 12px; text-wrap: balance; }
@media (max-width: 600px) {
  .bar { width: 110px; }
  .big { font-size: 15px; }
  #prompt { font-size: 12px; }
}
</style>

<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hurt"></div>
  <div id="cross"></div>
  <div id="tl" class="hud">
    <div class="label">Oleada</div>
    <div class="big" id="wave">–</div>
    <div id="next"></div>
  </div>
  <div id="tr" class="hud">
    <div class="label">Puntos</div>
    <div class="big" id="score">0</div>
  </div>
  <div id="bl" class="hud">
    <div class="pl">
      <div class="avatar">
        <img id="av-img" alt="" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 22c0-4.8 3.8-8.5 8.5-8.5s8.5 3.7 8.5 8.5z"/></svg>
      </div>
      <div>
        <div class="label">Dinero</div>
        <div class="big" id="money">$0</div>
      </div>
    </div>
    <div class="label" style="margin-top:8px">Vida</div>
    <div class="bar"><div id="hp-fill"></div></div>
    <div id="stwrap"><div id="st-fill"></div></div>
  </div>
  <div id="br" class="hud">
    <div class="label" id="wname">Pistola</div>
    <div class="big" id="ammo">12 / 48</div>
    <div id="reloading" hidden>Recargando…</div>
  </div>
  <div id="pw" class="hud"></div>
  <div id="prompt" class="hud"></div>
  <div id="overlay">
    <h1 id="ov-title"></h1>
    <p id="ov-text"></p>
    <div id="btns"><button id="btn-go" type="button">Iniciar</button><button id="btn-opts" type="button">Opciones</button><button id="btn-quit" type="button">Desconectar</button></div>
    <p id="ov-hint"></p>
    <div id="opts" hidden>
      <div id="opts-btns"><button id="btn-gfx" type="button">Gráficos: Alto</button><button id="btn-snd" type="button">Sonido: Sí</button></div>
      <p id="opts-hint">Si el juego va lento, bajá los gráficos. Se guarda en este navegador.</p>
      <button id="btn-back" type="button">Volver</button>
    </div>
    <label id="av-pick" class="pick">Elegir foto del jugador<input id="av-file" type="file" accept="image/*" hidden></label>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="mapa.js"></script>
<script src="mapa2.js"></script>
<script src="mundo3.js"></script>
<script src="decor2.js"></script>
<script src="sonido.js"></script>
<script src="game.js"></script>
